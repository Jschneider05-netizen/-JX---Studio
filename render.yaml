# Review-only service configuration. Do not create a second service or database.
# Apply build/start/env settings to the EXISTING Render service manually.
services:
  - type: web
    name: jx-studio
    runtime: node
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: PUBLIC_SITE_URL
        value: https://jx-studio.de
      - key: DATABASE_URL
        sync: false
      - key: JXSTUDIO_ADMIN_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: kontakt@jx-studio.de
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JX_ASSISTANT_EXTERNAL_ENABLED
        value: 'false'
      - key: JX_INTERNAL_BILLING_ENABLED
        value: 'false'
